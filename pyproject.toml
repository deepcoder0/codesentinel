[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesentinel"
version = "0.1.0"
description = "Multi-agent AI code review system powered by LangGraph, RAG, and MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Deepanshu" },
]

dependencies = [
    # LangGraph & LangChain
    "langgraph>=0.2.0,<0.3.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",

    # LLM
    "langchain-ollama>=0.2.0",

    # Vector DB & Embeddings
    "chromadb>=0.5.0,<0.6.0",
    "sentence-transformers>=3.0.0,<4.0.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # GitHub
    "PyGithub>=2.3.0",

    # Data validation
    "pydantic>=2.7.0,<3.0.0",

    # HTTP
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.0.0",

    # Environment
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

observability = [
    "langfuse>=2.0.0",
]

mcp = [
    "mcp>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codesentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["codesentinel"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
